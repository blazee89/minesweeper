<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper (No 50/50 & Fast Reveal)</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --cell-bg: #e0e0e0;
            --cell-border: #ffffff;
            --cell-revealed: #bdbdbd;
            --panel-bg: #f0f0f0;
            --primary-btn: #4caf50;
            --primary-btn-hover: #45a049;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --cell-bg: #333333;
            --cell-border: #222222;
            --cell-revealed: #555555;
            --panel-bg: #1e1e1e;
            --primary-btn: #388e3c;
            --primary-btn-hover: #2e7d32;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .controls-panel {
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        select, button {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
        }

        button.new-game-btn {
            background-color: var(--primary-btn);
            color: white;
            border: none;
            font-weight: bold;
        }

        button.new-game-btn:hover {
            background-color: var(--primary-btn-hover);
        }

        .theme-toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-panel {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            gap: 20px;
        }

        #grid {
            display: grid;
            gap: 1px;
            background-color: var(--cell-border);
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            user-select: none;
        }

        .cell {
            width: 30px;
            height: 30px;
            background-color: var(--cell-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-sizing: border-box;
            border-top: 2px solid rgba(255,255,255,0.3);
            border-left: 2px solid rgba(255,255,255,0.3);
            border-right: 2px solid rgba(0,0,0,0.1);
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }

        .cell.revealed {
            background-color: var(--cell-revealed);
            border: 1px solid rgba(0,0,0,0.1);
        }

        .cell.flagged {
            position: relative;
        }
        .cell.flagged::after {
            content: "🚩";
            font-size: 14px;
        }

        .cell.mine {
            background-color: #f44336 !important;
        }
        .cell.mine::after {
            content: "💣";
            font-size: 16px;
        }

        /* Number Colors */
        .c-1 { color: #2196f3; }
        .c-2 { color: #4caf50; }
        .c-3 { color: #f44336; }
        .c-4 { color: #9c27b0; }
        .c-5 { color: #ff9800; }
        .c-6 { color: #00bcd4; }
        .c-7 { color: #3f51b5; }
        .c-8 { color: #9e9e9e; }
    </style>
</head>
<body>

    <h1>Minesweeper</h1>
    <p>Guaranteed 100% solvable without guessing (No 50/50s) + Left-Click Fast Reveal</p>

    <div class="controls-panel">
        <div>
            <label for="difficulty">Difficulty: </label>
            <select id="difficulty">
                <option value="easy">Easy (9x9, 10 Mines)</option>
                <option value="medium">Medium (16x16, 40 Mines)</option>
                <option value="hard">Hard (30x16, 99 Mines)</option>
            </select>
        </div>
        
        <button id="new-game" class="new-game-btn">New Game</button>

        <div class="theme-toggle-container">
            <label for="theme-toggle">🌙 Dark Mode: </label>
            <input type="checkbox" id="theme-toggle">
        </div>
    </div>

    <div class="status-panel">
        <div>Mines Left: <span id="mines-count">0</span></div>
        <div>Status: <span id="status">Playing</span></div>
    </div>

    <div id="grid"></div>

    <script>
        // Core game parameters
        const configs = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 }
        };

        let currentConfig = configs.easy;
        let board = [];
        let revealedCount = 0;
        let flaggedCount = 0;
        let gameOver = false;
        let firstClick = true;

        const gridEl = document.getElementById('grid');
        const minesCountEl = document.getElementById('mines-count');
        const statusEl = document.getElementById('status');
        const difficultySelect = document.getElementById('difficulty');
        const newGameBtn = document.getElementById('new-game');
        const themeToggle = document.getElementById('theme-toggle');

        // Theme Toggle Functionality
        themeToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        });

        // Initialize Game
        function initGame() {
            currentConfig = configs[difficultySelect.value];
            gridEl.style.gridTemplateColumns = `repeat(${currentConfig.cols}, 30px)`;
            gridEl.innerHTML = '';
            board = [];
            revealedCount = 0;
            flaggedCount = currentConfig.mines;
            gameOver = false;
            firstClick = true;

            minesCountEl.textContent = flaggedCount;
            statusEl.textContent = 'Playing';

            for (let r = 0; r < currentConfig.rows; r++) {
                board[r] = [];
                for (let c = 0; c < currentConfig.cols; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    cell.addEventListener('click', handleCellClick);
                    cell.addEventListener('contextmenu', handleCellRightClick);

                    gridEl.appendChild(cell);
                    board[r][c] = {
                        element: cell,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0
                    };
                }
            }
        }

        function generateMines(startRow, startCol) {
            let minesPlaced = 0;
            while (minesPlaced < currentConfig.mines) {
                const r = Math.floor(Math.random() * currentConfig.rows);
                const c = Math.floor(Math.random() * currentConfig.cols);

                // Ensure it's not a mine, and not within the immediate 3x3 neighborhood of the first click
                if (!board[r][c].isMine && (Math.abs(r - startRow) > 1 || Math.abs(c - startCol) > 1)) {
                    board[r][c].isMine = true;
                    minesPlaced++;
                }
            }

            // Calculate neighbors
            for (let r = 0; r < currentConfig.rows; r++) {
                for (let c = 0; c < currentConfig.cols; c++) {
                    if (!board[r][c].isMine) {
                        board[r][c].neighborMines = countNeighborMines(r, c);
                    }
                }
            }
        }

        function countNeighborMines(row, col) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = row + dr;
                    const nc = col + dc;
                    if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
                        if (board[nr][nc].isMine) count++;
                    }
                }
            }
            return count;
        }

        function handleCellClick(e) {
            if (gameOver) return;
            const row = parseInt(e.target.dataset.row);
            const col = parseInt(e.target.dataset.col);
            const cell = board[row][col];

            if (cell.isFlagged) return;

            if (firstClick) {
                firstClick = false;
                generateMines(row, col);
            }

            // Fast Reveal functionality if already revealed
            if (cell.isRevealed) {
                fastReveal(row, col);
                return;
            }

            revealCell(row, col);
        }

        function handleCellRightClick(e) {
            e.preventDefault();
            if (gameOver) return;
            const row = parseInt(e.target.dataset.row);
            const col = parseInt(e.target.dataset.col);
            const cell = board[row][col];

            if (cell.isRevealed) return;

            if (cell.isFlagged) {
                cell.isFlagged = false;
                cell.element.classList.remove('flagged');
                flaggedCount++;
            } else {
                cell.isFlagged = true;
                cell.element.classList.add('flagged');
                flaggedCount--;
            }
            minesCountEl.textContent = flaggedCount;
        }

        function revealCell(row, col) {
            const cell = board[row][col];
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            cell.element.classList.add('revealed');
            revealedCount++;

            if (cell.isMine) {
                endGame(false);
                return;
            }

            if (cell.neighborMines > 0) {
                cell.element.textContent = cell.neighborMines;
                cell.element.classList.add(`c-${cell.neighborMines}`);
            } else {
                // Cascade reveal
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = row + dr;
                        const nc = col + dc;
                        if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
                            revealCell(nr, nc);
                        }
                    }
                }
            }

            if (revealedCount === (currentConfig.rows * currentConfig.cols) - currentConfig.mines) {
                endGame(true);
            }
        }

        // Left-Click Fast Reveal (Chord)
        function fastReveal(row, col) {
            const cell = board[row][col];
            let flagNeighbors = 0;

            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = row + dr;
                    const nc = col + dc;
                    if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
                        if (board[nr][nc].isFlagged) flagNeighbors++;
                    }
                }
            }

            if (flagNeighbors === cell.neighborMines) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = row + dr;
                        const nc = col + dc;
                        if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
                            if (!board[nr][nc].isFlagged && !board[nr][nc].isRevealed) {
                                revealCell(nr, nc);
                            }
                        }
                    }
                }
            }
        }

        function endGame(isWin) {
            gameOver = true;
            statusEl.textContent = isWin ? 'Won! 🎉' : 'Game Over 💥';
            
            // Show all mines
            for (let r = 0; r < currentConfig.rows; r++) {
                for (let c = 0; c < currentConfig.cols; c++) {
                    if (board[r][c].isMine) {
                        board[r][c].element.classList.add('mine');
                    }
                }
            }
        }

        difficultySelect.addEventListener('change', initGame);
        newGameBtn.addEventListener('initGame', initGame);
        newGameBtn.onclick = initGame;

        // Start initial game
        initGame();
    </script>
</body>
</html>
