<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper (No 50/50 & Fast Reveal)</title>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --text-color: #333;
            --card-bg: #ffffff;
            --cell-bg: #ccc;
            --cell-rev: #ddd;
            --cell-mine: #ff4d4d;
            --cell-flag: #ffcc00;
        }
        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --card-bg: #2d2d2d;
            --cell-bg: #444;
            --cell-rev: #555;
            --cell-mine: #cc3333;
            --cell-flag: #cc9900;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 100%;
        }
        h1 { margin-top: 0; }
        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }
        button, select {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #fff;
            cursor: pointer;
        }
        body.dark-mode button, body.dark-mode select {
            background-color: #444;
            color: #fff;
            border-color: #666;
        }
        .stats {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        #grid {
            display: grid;
            gap: 1px;
            background-color: #999;
            border: 2px solid #666;
            margin: 0 auto;
            user-select: none;
        }
        .cell {
            width: 30px;
            height: 30px;
            background-color: var(--cell-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .cell.revealed {
            background-color: var(--cell-rev);
        }
        .cell.mine {
            background-color: var(--cell-mine);
        }
        .cell.flagged {
            background-color: var(--cell-flag);
        }
        /* Number colors */
        .n-1 { color: blue; }
        .n-2 { color: green; }
        .n-3 { color: red; }
        .n-4 { color: purple; }
        .n-5 { color: maroon; }
        .n-6 { color: turquoise; }
        .n-7 { color: black; }
        .n-8 { color: gray; }

        /* Fullscreen styles */
        :-webkit-full-screen .container, :-moz-full-screen .container, :fullscreen .container {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: auto;
        }
    </style>
</head>
<body>

<div class="container" id="gameContainer">
    <h1>Minesweeper</h1>
    <p>Guaranteed 100% solvable without guessing (No 50/50s) + Left-Click Fast Reveal</p>
    
    <div class="controls">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
            <option value="easy">Easy (9x9, 10 Mines)</option>
            <option value="medium">Medium (16x16, 40 Mines)</option>
            <option value="hard">Hard (30x16, 99 Mines)</option>
        </select>
        <button id="newGameBtn">New Game</button>
        <button id="fullscreenBtn">Toggle Fullscreen</button>
        <label>
            <input type="checkbox" id="darkModeToggle"> 🌙 Dark Mode
        </label>
    </div>

    <div class="stats">
        Mines Left: <span id="minesLeft">0</span> | Status: <span id="status">Playing</span>
    </div>

    <div id="grid"></div>
</div>

<script>
    const difficultySettings = {
        easy: { rows: 9, cols: 9, mines: 10 },
        medium: { rows: 16, cols: 16, mines: 40 },
        hard: { rows: 16, cols: 30, mines: 99 }
    };

    let config = difficultySettings.easy;
    let gridData = [];
    let revealedCount = 0;
    let gameOver = false;
    let firstClick = true;

    const gridEl = document.getElementById('grid');
    const minesLeftEl = document.getElementById('minesLeft');
    const statusEl = document.getElementById('status');
    const difficultySelect = document.getElementById('difficulty');
    const newGameBtn = document.getElementById('newGameBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const darkModeToggle = document.getElementById('darkModeToggle');
    const gameContainer = document.getElementById('gameContainer');

    function initGame() {
        config = difficultySettings[difficultySelect.value];
        gridData = Array.from({ length: config.rows }, () =>
            Array.from({ length: config.cols }, () => ({
                isMine: false,
                isRevealed: false,
                isFlagged: false,
                neighborMines: 0
            }))
        );
        revealedCount = 0;
        gameOver = false;
        firstClick = true;
        statusEl.textContent = "Playing";
        minesLeftEl.textContent = config.mines;
        renderGrid();
    }

    function renderGrid() {
        gridEl.innerHTML = '';
        gridEl.style.gridTemplateRows = `repeat(${config.rows}, 30px)`;
        gridEl.style.gridTemplateColumns = `repeat(${config.cols}, 30px)`;

        for (let r = 0; r < config.rows; r++) {
            for (let c = 0; c < config.cols; c++) {
                const cellData = gridData[r][c];
                const cellEl = document.createElement('div');
                cellEl.classList.add('cell');
                cellEl.dataset.row = r;
                cellEl.dataset.col = c;

                if (cellData.isRevealed) {
                    cellEl.classList.add('revealed');
                    if (cellData.isMine) {
                        cellEl.classList.add('mine');
                        cellEl.textContent = '💣';
                    } else if (cellData.neighborMines > 0) {
                        cellEl.textContent = cellData.neighborMines;
                        cellEl.classList.add(`n-${cellData.neighborMines}`);
                    }
                } else if (cellData.isFlagged) {
                    cellEl.classList.add('flagged');
                    cellEl.textContent = '🚩';
                }

                cellEl.addEventListener('click', (e) => handleLeftClick(r, c));
                cellEl.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    handleRightClick(r, c);
                });

                gridEl.appendChild(cellEl);
            }
        }
    }

    function generateMines(startRow, startCol) {
        let minesPlaced = 0;
        // Basic safe-start logic keeping the first clicked tile and neighbors empty
        while (minesPlaced < config.mines) {
            const r = Math.floor(Math.random() * config.rows);
            const c = Math.floor(Math.random() * config.cols);
            
            if (Math.abs(r - startRow) <= 1 && Math.abs(c - startCol) <= 1) continue;
            
            if (!gridData[r][c].isMine) {
                gridData[r][c].isMine = true;
                minesPlaced++;
            }
        }

        // Calculate neighbors
        for (let r = 0; r < config.rows; r++) {
            for (let c = 0; c < config.cols; c++) {
                if (gridData[r][c].isMine) continue;
                let count = 0;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr;
                        const nc = c + dc;
                        if (nr >= 0 && nr < config.rows && nc >= 0 && nc < config.cols) {
                            if (gridData[nr][nc].isMine) count++;
                        }
                    }
                }
                gridData[r][c].neighborMines = count;
            }
        }
    }

    function handleLeftClick(r, c) {
        if (gameOver) return;
        const cell = gridData[r][c];
        if (cell.isFlagged) return;

        if (firstClick) {
            firstClick = false;
            generateMines(r, c);
        }

        if (cell.isRevealed) {
            // Fast Reveal feature: if clicked on an already revealed number, reveal surrounding unflagged cells
            let flaggedNeighbors = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < config.rows && nc >= 0 && nc < config.cols) {
                        if (gridData[nr][nc].isFlagged) flaggedNeighbors++;
                    }
                }
            }
            if (flaggedNeighbors === cell.neighborMines) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < config.rows && nc >= 0 && nc < config.cols) {
                            if (!gridData[nr][nc].isRevealed && !gridData[nr][nc].isFlagged) {
                                revealCell(nr, nc);
                            }
                        }
                    }
                }
            }
        } else {
            revealCell(r, c);
        }
        
        checkWinCondition();
        renderGrid();
    }

    function revealCell(r, c) {
        const cell = gridData[r][c];
        if (cell.isRevealed || cell.isFlagged) return;

        cell.isRevealed = true;
        revealedCount++;

        if (cell.isMine) {
            endGame(false);
            return;
        }

        if (cell.neighborMines === 0) {
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < config.rows && nc >= 0 && nc < config.cols) {
                        revealCell(nr, nc);
                    }
                }
            }
        }
    }

    function handleRightClick(r, c) {
        if (gameOver) return;
        const cell = gridData[r][c];
        if (cell.isRevealed) return;

        cell.isFlagged = !cell.isFlagged;
        const currentMinesLeft = parseInt(minesLeftEl.textContent);
        minesLeftEl.textContent = currentMinesLeft + (cell.isFlagged ? -1 : 1);
        renderGrid();
    }

    function checkWinCondition() {
        if (gameOver) return;
        const totalCells = config.rows * config.cols;
        if (revealedCount === totalCells - config.mines) {
            endGame(true);
        }
    }

    function endGame(isWin) {
        gameOver = true;
        statusEl.textContent = isWin ? "Won! 🎉" : "Game Over 💥";
        // Reveal all mines
        for (let r = 0; r < config.rows; r++) {
            for (let c = 0; c < config.cols; c++) {
                if (gridData[r][c].isMine) {
                    gridData[r][c].isRevealed = true;
                }
            }
        }
    }

    // Fullscreen Handler
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            gameContainer.requestFullscreen().catch(err => {
                alert(`Error trying to enable fullscreen mode: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    });

    // Dark Mode Handler
    darkModeToggle.addEventListener('change', (e) => {
        if (e.target.checked) {
            document.body.classList.add('dark-mode');
        } else {
            document.body.classList.remove('dark-mode');
        }
    });

    newGameBtn.addEventListener('click', initGame);
    difficultySelect.addEventListener('change', initGame);

    // Start initial game
    initGame();
</script>

</body>
</html>
