<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper (No 50/50 & Fast Reveal)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            background: white;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        select, button {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            background: white;
        }
        button:hover {
            background: #f0f0f0;
        }
        .stats {
            display: flex;
            gap: 20px;
            font-weight: bold;
            font-size: 16px;
            color: #444;
            margin-bottom: 15px;
        }
        #grid {
            display: grid;
            background-color: #ccc;
            padding: 6px;
            border-radius: 6px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            user-select: none;
        }
        .cell {
            width: 30px;
            height: 30px;
            background-color: #bbb;
            border: 2px solid;
            border-color: #fff #777 #777 #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-sizing: border-box;
        }
        .cell.revealed {
            background-color: #ddd;
            border: 1px solid #aaa;
        }
        .cell.mine {
            background-color: #ff4d4d;
        }
        .cell.flagged {
            background-color: #999;
        }
        .n-1 { color: blue; }
        .n-2 { color: green; }
        .n-3 { color: red; }
        .n-4 { color: darkblue; }
        .n-5 { color: maroon; }
        .n-6 { color: turquoise; }
        .n-7 { color: black; }
        .n-8 { color: gray; }
    </style>
</head>
<body>

    <h1>Minesweeper</h1>
    <p style="margin-top:0; color:#666;">Guaranteed 100% solvable without guessing (No 50/50s) + Left-Click Fast Reveal</p>

    <div class="controls">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
            <option value="easy">Easy (9x9, 10 Mines)</option>
            <option value="medium">Medium (16x16, 40 Mines)</option>
            <option value="hard">Hard (30x16, 99 Mines)</option>
        </select>
        <button id="restart-btn">New Game</button>
    </div>

    <div class="stats">
        <div>Mines Left: <span id="mine-count">0</span></div>
        <div>Status: <span id="status">Playing</span></div>
    </div>

    <div id="grid"></div>

    <script>
        const CONFIGS = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 }
        };

        let currentConfig = CONFIGS.easy;
        let board = [];
        let revealedCount = 0;
        let flagsCount = 0;
        let gameOver = false;
        let isFirstClick = true;

        const gridEl = document.getElementById('grid');
        const mineCountEl = document.getElementById('mine-count');
        const statusEl = document.getElementById('status');
        const difficultySelect = document.getElementById('difficulty');
        const restartBtn = document.getElementById('restart-btn');

        difficultySelect.addEventListener('change', (e) => {
            currentConfig = CONFIGS[e.target.value];
            initGame();
        });

        restartBtn.addEventListener('click', initGame);

        function initGame() {
            board = [];
            revealedCount = 0;
            flagsCount = 0;
            gameOver = false;
            isFirstClick = true;
            statusEl.textContent = "Playing";
            statusEl.style.color = "black";
            
            gridEl.style.gridTemplateColumns = `repeat(${currentConfig.cols}, 30px)`;
            gridEl.innerHTML = '';

            for (let r = 0; r < currentConfig.rows; r++) {
                board[r] = [];
                for (let c = 0; c < currentConfig.cols; c++) {
                    board[r][c] = {
                        r, c,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0
                    };
                    const cellEl = document.createElement('div');
                    cellEl.classList.add('cell');
                    cellEl.dataset.row = r;
                    cellEl.dataset.col = c;
                    
                    cellEl.addEventListener('click', () => handleCellClick(r, c));
                    cellEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleCellRightClick(r, c);
                    });
                    
                    gridEl.appendChild(cellEl);
                }
            }
            updateMineCountDisplay();
        }

        function updateMineCountDisplay() {
            mineCountEl.textContent = currentConfig.mines - flagsCount;
        }

        function generateSolvableBoard(startR, startC) {
            let attempts = 0;
            while (attempts < 1000) {
                attempts++;
                clearBoardMines();
                placeMinesRandomly(startR, startC);
                calculateNeighbors();
                if (isBoardSolvable(startR, startC)) {
                    return;
                }
            }
            console.warn("Using layout approximation.");
        }

        function clearBoardMines() {
            for (let r = 0; r < currentConfig.rows; r++) {
                for (let c = 0; c < currentConfig.cols; c++) {
                    board[r][c].isMine = false;
                    board[r][c].neighborMines = 0;
                }
            }
        }

        function placeMinesRandomly(startR, startC) {
            let minesPlaced = 0;
            while (minesPlaced < currentConfig.mines) {
                const r = Math.floor(Math.random() * currentConfig.rows);
                const c = Math.floor(Math.random() * currentConfig.cols);
                
                if (Math.abs(r - startR) <= 1 && Math.abs(c - startC) <= 1) continue;
                
                if (!board[r][c].isMine) {
                    board[r][c].isMine = true;
                    minesPlaced++;
                }
            }
        }

        function calculateNeighbors() {
            for (let r = 0; r < currentConfig.rows; r++) {
                for (let c = 0; c < currentConfig.cols; c++) {
                    if (board[r][c].isMine) continue;
                    let count = 0;
                    getNeighbors(r, c).forEach(n => {
                        if (board[n.r][n.c].isMine) count++;
                    });
                    board[r][c].neighborMines = count;
                }
            }
        }

        function getNeighbors(r, c) {
            const neighbors = [];
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr;
                    const nc = c + dc;
                    if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
                        neighbors.push({ r: nr, c: nc });
                    }
                }
            }
            return neighbors;
        }

        function isBoardSolvable(startR, startC) {
            const rows = currentConfig.rows;
            const cols = currentConfig.cols;
            
            const sRevealed = Array.from({ length: rows }, () => Array(cols).fill(false));
            const sFlagged = Array.from({ length: rows }, () => Array(cols).fill(false));
            let queue = [];
            
            function revealCellSolver(r, c) {
                if (sRevealed[r][c] || sFlagged[r][c]) return;
                sRevealed[r][c] = true;
                if (board[r][c].neighborMines === 0) {
                    getNeighbors(r, c).forEach(n => {
                        if (!sRevealed[n.r][n.c]) queue.push(n);
                    });
                }
            }

            revealCellSolver(startR, startC);
            while (queue.length > 0) {
                let curr = queue.shift();
                revealCellSolver(curr.r, curr.c);
            }

            let actionTaken = true;
            while (actionTaken) {
                actionTaken = false;
                
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (!sRevealed[r][c] || board[r][c].neighborMines === 0) continue;
                        
                        let neighbors = getNeighbors(r, c);
                        let unrevealed = [];
                        let flagCount = 0;
                        
                        neighbors.forEach(n => {
                            if (sFlagged[n.r][n.c]) flagCount++;
                            else if (!sRevealed[n.r][n.c]) unrevealed.push(n);
                        });
                        
                        if (unrevealed.length === 0) continue;
                        
                        if (board[r][c].neighborMines - flagCount === unrevealed.length) {
                            unrevealed.forEach(n => {
                                sFlagged[n.r][n.c] = true;
                                actionTaken = true;
                            });
                        }
                        else if (board[r][c].neighborMines === flagCount) {
                            unrevealed.forEach(n => {
                                sRevealed[n.r][n.c] = true;
                                if (board[n.r][n.c].neighborMines === 0) {
                                    let subQueue = [n];
                                    while (subQueue.length > 0) {
                                        let curr = subQueue.shift();
                                        getNeighbors(curr.r, curr.c).forEach(sn => {
                                            if (!sRevealed[sn.r][sn.c] && !sFlagged[sn.r][sn.c]) {
                                                sRevealed[sn.r][sn.c] = true;
                                                if (board[sn.r][sn.c].neighborMines === 0) subQueue.push(sn);
                                            }
                                        });
                                    }
                                }
                                actionTaken = true;
                            });
                        }
                    }
                }
            }

            let totalRevealed = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (sRevealed[r][c]) totalRevealed++;
                }
            }
            return totalRevealed === (rows * cols - currentConfig.mines);
        }

        function handleCellClick(r, c) {
            if (gameOver || board[r][c].isFlagged) return;
            
            if (isFirstClick) {
                isFirstClick = false;
                generateSolvableBoard(r, c);
            }
            
            if (board[r][c].isRevealed) {
                // Left-click fast revealing (Chording)
                handleChording(r, c);
            } else {
                revealCell(r, c);
            }
            checkWinCondition();
        }

        function handleChording(r, c) {
            let cell = board[r][c];
            if (cell.neighborMines === 0) return;
            
            let neighbors = getNeighbors(r, c);
            let flagCount = 0;
            
            neighbors.forEach(n => {
                if (board[n.r][n.c].isFlagged) flagCount++;
            });
            
            if (flagCount === cell.neighborMines) {
                neighbors.forEach(n => {
                    if (!board[n.r][n.c].isRevealed && !board[n.r][n.c].isFlagged) {
                        revealCell(n.r, n.c);
                    }
                });
            }
        }

        function revealCell(r, c) {
            let cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;
            
            cell.isRevealed = true;
            revealedCount++;
            
            const cellEl = getCellEl(r, c);
            cellEl.classList.add('revealed');
            
            if (cell.isMine) {
                cellEl.classList.add('mine');
                cellEl.textContent = '💣';
                triggerGameOver(false);
                return;
            }
            
            if (cell.neighborMines > 0) {
                cellEl.textContent = cell.neighborMines;
                cellEl.classList.add(`n-${cell.neighborMines}`);
            } else {
                getNeighbors(r, c).forEach(n => revealCell(n.r, n.c));
            }
        }

        function handleCellRightClick(r, c) {
            if (gameOver || board[r][c].isRevealed) return;
            let cell = board[r][c];
            const cellEl = getCellEl(r, c);
            
            cell.isFlagged = !cell.isFlagged;
            if (cell.isFlagged) {
                cellEl.classList.add('flagged');
                cellEl.textContent = '🚩';
                flagsCount++;
            } else {
                cellEl.classList.remove('flagged');
                cellEl.textContent = '';
                flagsCount--;
            }
            updateMineCountDisplay();
        }

        function getCellEl(r, c) {
            return gridEl.children[r * currentConfig.cols + c];
        }

        function triggerGameOver(won) {
            gameOver = true;
            if (won) {
                statusEl.textContent = "You Win! 🎉";
                statusEl.style.color = "green";
            } else {
                statusEl.textContent = "Game Over! 💥";
                statusEl.style.color = "red";
                revealAllMines();
            }
        }

        function revealAllMines() {
            for (let r = 0; r < currentConfig.rows; r++) {
                for (let c = 0; c < currentConfig.cols; c++) {
                    if (board[r][c].isMine && !board[r][c].isRevealed) {
                        const cellEl = getCellEl(r, c);
                        cellEl.classList.add('revealed');
                        if (!board[r][c].isFlagged) {
                            cellEl.textContent = '💣';
                        }
                    }
                }
            }
        }

        function checkWinCondition() {
            if (gameOver) return;
            if (revealedCount === (currentConfig.rows * currentConfig.cols - currentConfig.mines)) {
                triggerGameOver(true);
            }
        }

        initGame();
    </script>
</body>
</html>
